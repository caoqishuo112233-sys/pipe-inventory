name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "index.html"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "microsoft"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Bundle HTML into APK
        run: |
          cp index.html android/app/src/main/assets/index.html
          cp manifest.json android/app/src/main/assets/manifest.json
          cp icon.svg android/app/src/main/assets/icon.svg

      - name: Build Debug APK
        working-directory: android
        run: |
          curl -sLo gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle.zip
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          gradle-8.5/bin/gradle assembleDebug

      - name: Prepare APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          echo "APK path: $APK"
          ls -la $APK 2>/dev/null || ls -la android/app/build/outputs/apk/debug/ 2>/dev/null || echo "No APK found"
          cp $APK PipeInventory.apk 2>/dev/null || echo "copy failed"
          ls -la PipeInventory.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PipeInventory-APK
          path: PipeInventory.apk

      - name: Upload fallback
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PipeInventory-APK-raw
          path: android/app/build/outputs/apk/
